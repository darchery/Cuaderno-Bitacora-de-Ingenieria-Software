<!DOCTYPE html>

<html lang="en-US">

 <head>

 <meta charset="utf-8" />

 <meta name="viewport" content="width=device-width, initial-scale=1.0" />

 <title>My test page</title>

 <link rel="stylesheet" href="style.css">

 <script src="script.js" defer></script>

 </head>

 <body>

    <h1>Ejercicios sobre peticiones de red</h1>

    <section>
      <h2>Ejercicio 10 - Cancelación de una petición</h2>
      <button id="fetch">Inciar petición</button>
      <button id="cancelar">Cancelar petición</button>
   </section>

   <section class="contenedor-tiempo"> 
      <h2>Ejericicio 13 - Widget de tiempo</h2>

      <div class="widget">
        
        <div class="buscador">
          <input type="text" name="ciudad" id="ciudad" placeholder="Nombre ciudad">
          <button id="obtener-datos">Obtener datos</button>
        </div>
        
        <div class="clima">

        </div>

      </div>
   </section>

   <section>
      <h2>Ejercicio 14 - Buscador personajes SNK</h2>
      <form id="formulario-busqueda">
        <h3>Buscador</h3>
        <div>
          <input type="text" name="nombre" id="nombre" placeholder="Eren, Levi, etc">
          <button id="buscar">Buscar personaje</button>
          <button type="button" id="cancelar-snk">Cancelar búsqueda</button>
        </div>
      </form>

      <div id="mensaje-estado">
        <h3>Mensajes de estado</h3>
      </div>

      <div id="resultados">
          <h3>Resultados</h3>
      </div>
   </section>
   <br><br>
   <hr>
 </body>

</html>
